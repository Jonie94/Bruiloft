<html lang="nl">
<head>
<meta charset="UTF-8">

<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="css/style.css">
<script src="js/config.js" defer></script>
</head>
<body class="has-thread">

<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-names">P &amp; J</a>
    <div class="nav-links">
      <a href="index.html">Home</a>

<section class="section wrap">
  <p class="eyebrow">RSVP</p>
  <h1>Kom je?</h1>
  <p class="muted" style="margin-top: 12px; max-width: 60ch;">
    Laat ons uiterlijk <strong>25-05-2027</strong> weten of je erbij bent.
  </p>

  <!-- ==================================================================
       FORMULIER 1: DAGGASTEN
       Alleen zichtbaar voor wie met het dag-wachtwoord is binnengekomen.
       ================================================================== -->
  <div data-guest="dag">
    <form
      name="rsvp-dag"
      method="POST"
      action="bedankt.html"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      style="max-width: 480px; margin-top: 40px;"
    >
      <!-- Verplicht voor Netlify: moet gelijk zijn aan name hierboven -->
      <input type="hidden" name="form-name" value="rsvp-dag">
      <!-- Spamval: echte mensen zien dit veld niet -->
      <p hidden><label>Niet invullen: <input name="bot-field"></label></p>

      <label for="dag-naam">Voor- en achternaam</label>
      <input type="text" id="dag-naam" name="naam" required>

      <label for="dag-aanwezig">Ben je erbij op 25 juni?</label>
      <select id="dag-aanwezig" name="aanwezig" required>
        <option value="">Kies een optie</option>
        <option value="ja">Ja, ik kom!</option>
        <option value="nee">Helaas, ik kan niet</option>
      </select>

      <!-- Alles in dit blok verdwijnt als iemand "nee" kiest -->
      <div class="rsvp-extra">
        <label for="dag-aantal">Met hoeveel personen kom je (inclusief jezelf)?</label>
        <input type="number" id="dag-aantal" name="aantal" min="1" value="1" required>

        <label for="dag-namen">Namen van partner/gezinsleden die meekomen</label>
        <input type="text" id="dag-namen" name="namen_meekomend">

        <label for="dag-dieet">Dieetwensen of allergieën</label>
        <textarea id="dag-dieet" name="dieet" rows="3"></textarea>

        <label for="dag-dans">Via welk e-mailadres kunnnn we je bereiken?</label>
        <input type="text" id="contact-mail" name="e-mailadres">
      </div>

      <label for="dag-opmerking">Nog iets dat we moeten weten?</label>
      <textarea id="dag-opmerking" name="opmerking" rows="3"></textarea>

      <button type="submit" class="btn">Versturen</button>
    </form>
  </div>

  <!-- ==================================================================
       FORMULIER 2: AVONDGASTEN
       Alleen zichtbaar voor wie met het avond-wachtwoord is binnengekomen.
       ================================================================== -->
  <div data-guest="avond">
    <form
      name="rsvp-avond"
      method="POST"
      action="/bedankt.html"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      style="max-width: 480px; margin-top: 40px;"
    >
      <input type="hidden" name="form-name" value="rsvp-avond">
      <p hidden><label>Niet invullen: <input name="bot-field"></label></p>

      <label for="avond-naam">Voor- en achternaam</label>
      <input type="text" id="avond-naam" name="naam" required>

      <label for="avond-aanwezig">Ben je erbij op 25 juni?</label>
      <select id="avond-aanwezig" name="aanwezig" required>
        <option value="">Kies een optie</option>
        <option value="ja">Ja, ik kom!</option>
        <option value="nee">Helaas, ik kan niet</option>
      </select>

      <!-- Alles in dit blok verdwijnt als iemand "nee" kiest -->
      <div class="rsvp-extra">
        <label for="avond-bij">Ik ben bij:</label>
        <select id="avond-bij" name="ik_ben_bij" required>
          <option value="">Kies een optie</option>
          <option value="ceremonie">De ceremonie</option>
          <option value="feest">Het feest</option>
          <option value="ceremonie-en-feest">De ceremonie en het feest</option>
        </select>

        <label for="avond-aantal">Met hoeveel personen kom je (inclusief jezelf)?</label>
        <input type="number" id="avond-aantal" name="aantal" min="1" value="1" required>

        <label for="dag-dans">Via welk e-mailadres kunnnn we je bereiken?</label>
        <input type="text" id="contact-mail" name="e-mailadres">
      </div>

      <label for="avond-opmerking">Nog iets dat we moeten weten?</label>
      <textarea id="avond-opmerking" name="opmerking" rows="3"></textarea>

      <button type="submit" class="btn">Versturen</button>
    </form>
  </div>
</section>

<footer class="footer">Puk &amp; Jonathan · 25 juni 2027</footer>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    requireUnlock();
    applyGuestVisibility();

    // Verberg de extra vragen als iemand aangeeft niet te komen
    document.querySelectorAll("form").forEach((form) => {
      const select = form.querySelector('select[name="aanwezig"]');
      const extra = form.querySelector(".rsvp-extra");
      if (!select || !extra) return;

      function update() {
        const komt = select.value !== "nee";
        extra.style.display = komt ? "" : "none";
        // Uitgeschakelde velden worden niet gevalideerd en niet meegestuurd
        extra.querySelectorAll("input, textarea, select").forEach((el) => {
          el.disabled = !komt;
        });
      }

      select.addEventListener("change", update);
      update();
    });
  });
</script>
</body>
</html>

<section class="section wrap">
  <p class="eyebrow">RSVP</p>
  <h1>Kom je?</h1>
  <p class="muted" style="margin-top: 12px; max-width: 60ch;">
    Geef ons uiterlijk <strong>1 mei 2027</strong> door of je erbij bent.
  </p>

  <!--
    LET OP — dit formulier heeft nog geen echte "postbus":
    het stuurt nu nergens naartoe. De makkelijkste manier om dit alsnog te
    laten werken, zonder een eigen server te bouwen:

    Optie A — Formspree (gratis tot 50 inzendingen/maand):
      1. Maak een gratis account op formspree.io
      2. Maak een "form", je krijgt een endpoint als
         https://formspree.io/f/abc12345
      3. Vervang hieronder action="#" door jouw endpoint
      4. Verander method="GET" niet aan — laat op POST staan

    Optie B — Tally.so:
      Maak daar een formulier en zet in plaats van dit hele <form>-blok
      een <iframe> met de embed-link die Tally je geeft.
  -->
  <form id="rsvp-form" action="#" method="POST" style="max-width: 480px; margin-top: 40px;">

    <label for="naam">Naam</label>
    <input type="text" id="naam" name="naam" required>

    <label for="aanwezig">Ben je erbij?</label>
    <select id="aanwezig" name="aanwezig" required>
      <option value="">Kies een optie</option>
      <option value="ja">Ja, ik kom!</option>
      <option value="nee">Helaas, ik kan niet</option>
    </select>

    <label for="aantal">Met hoeveel personen (inclusief jezelf)?</label>
    <input type="number" id="aantal" name="aantal" min="1" value="1">

    <fieldset data-guest="dag">
      <label for="dieet">Dieetwensen of allergieën</label>
      <textarea id="dieet" name="dieet" rows="3"></textarea>
    </fieldset>

    <label for="dans">Verzoeknummer voor de DJ (optioneel)</label>
    <input type="text" id="dans" name="dans">

    <input type="hidden" id="gasttype" name="gasttype" value="">

    <button type="submit" class="btn">Versturen</button>
    <p class="muted" id="rsvp-note" style="margin-top: 16px; font-size: 0.85rem;"></p>
  </form>
</section>

<footer class="footer">Puk &amp; Jonathan · 25 juni 2027</footer>

<script>
  requireUnlock();
  document.addEventListener("DOMContentLoaded", () => {
    applyGuestVisibility();
    const type = getGuestType();
    document.getElementById("gasttype").value = type || "";
    document.getElementById("rsvp-note").textContent =
      "Let op: dit formulier werkt pas als action=\"#\" hierboven is vervangen door een echt formulier-endpoint (zie de code-comment).";
  });
</script>
